services:
  backend:
    build: ./backend
    ports: 
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    networks:
      - interview-network

  frontend:
    build: ./frontend
    ports: 
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - interview-network
    depends_on:
      - backend

networks:
  interview-network:
    driver: bridge
